<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Stefnuhringur Reykjanesbæjar</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>
  <!--
    Stefnuhringur Reykjanesbæjar.
    Stillt með færibreytum í slóð, t.d.:
      widget/?speed=90&visible=60&theme=dark
    Sjá README fyrir allar stillingar. Efni hringsins er í content.js.
  -->
  <div class="sh" id="sh" role="region" aria-label="Stefnuhringur Reykjanesbæjar">
    <p class="sr-only" id="summary"></p>
    <svg id="svg" focusable="false">
      <defs><clipPath id="crop"><rect id="cropRect"/></clipPath></defs>
      <g clip-path="url(#crop)">
        <g id="cam1"><g id="ring"></g><g id="glyphs" aria-hidden="true"></g><g id="labels" aria-hidden="true"></g></g>
      </g>
      <g id="cam2"><g id="hub" aria-hidden="true"></g></g>
    </svg>
    <div class="sr-only" aria-live="polite" id="live"></div>
  </div>

  <script src="content.js"></script>
  <script src="config.js"></script>
  <script src="widget.js"></script>
</body>
</html>
