<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https:; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Stefnuhringur Reykjanesbæjar</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="widget.css">
</head>
<body>
  <!--
    Stefnuhringur Reykjanesbæjar.
    Stillt með færibreytum í slóð, t.d.:
      widget/?speed=90&visible=60&theme=dark
    Sjá README fyrir allar stillingar. Efni hringsins er í content.js.
  -->
  <div class="sh" id="sh" role="region" aria-label="Stefnuhringur Reykjanesbæjar">
    <p class="sr-only" id="summary"></p>
    <svg id="svg" focusable="false">
      <g id="cam"><g id="hub" aria-hidden="true"></g></g>
    </svg>
    <!-- Hringurinn sjálfur: HTML-lag ofan á SVG-inu sem snýst á compositor-
         þræði vafrans (Web Animations). Tákn og heiti mótsnúast og haldast
         upprétt. Sjá haus widget.js. -->
    <div class="lbl-layer" id="lblLayer"><div class="lbl-stage" id="lblStage">
      <div class="rot" id="rot">
        <svg class="ring-svg" id="ringSvg" focusable="false"><g id="ring"></g></svg>
      </div>
    </div></div>
    <div class="sr-only" aria-live="polite" id="live"></div>
  </div>

  <script src="content.js"></script>
  <script src="config.js"></script>
  <script src="widget.js"></script>
</body>
</html>
