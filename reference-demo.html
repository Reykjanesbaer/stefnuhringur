<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stefnuhringur – forskoðun og kóðasmiður</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #EEF1F3; --panel: #FFFFFF; --ink: #1F2629; --muted: #5C676C; --line: #D5DCDF;
    --accent: #2760AB;
    --font: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #16191B; --panel: #1F2427; --ink: #E7ECEE; --muted: #9AA6AB; --line: #323B3F; --accent: #7FA8E0; }
  }
  :root[data-theme="dark"] { --page: #16191B; --panel: #1F2427; --ink: #E7ECEE; --muted: #9AA6AB; --line: #323B3F; --accent: #7FA8E0; }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); font-size: 1rem; line-height: 1.5; }
  main { max-width: 60rem; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
  h1 { font-weight: 800; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1.1; margin: 0 0 .35rem; }
  .lede { color: var(--muted); margin: 0 0 1.5rem; max-width: 38rem; }
  h2 { font-size: 1.15rem; font-weight: 700; margin: 0 0 .75rem; }

  .stage { padding: 1.25rem; border-radius: 16px; background:
    repeating-conic-gradient(color-mix(in srgb, var(--line) 45%, transparent) 0 25%, transparent 0 50%) 0 0 / 18px 18px; }
  .holder { width: 100%; }

  /* ---------- widget ---------- */
  .sh { --w-bg: #FFFFFF; position: relative; overflow: hidden; background: var(--w-bg); touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  .sh[data-wtheme="dark"] { --w-bg: #2B2B2B; }
  @media (prefers-color-scheme: dark) { .sh[data-wtheme="auto"] { --w-bg: #2B2B2B; } }
  .sh.transparent { --w-bg: transparent; }
  .sh svg { display: block; width: 100%; height: auto; }
  .seg { cursor: pointer; outline: none; }
  .seg > * { transition: opacity .35s; }
  .seg:hover .shape { filter: brightness(1.06); }
  .seg:focus-visible .shape { stroke: var(--ink); stroke-width: 3; }
  .sh[data-wtheme="dark"] .seg:focus-visible .shape { stroke: #fff; }
  .dim { opacity: .3; }
  .lbl, .glyph { pointer-events: none; transition: opacity .35s; }
  .lbl text { fill: #fff; }
  .lbl .t { font-family: var(--font); font-weight: 800; font-size: 18px; }
  .lbl .d { font-family: var(--font); font-weight: 500; font-size: 8.2px; }
  .tile text { fill: #fff; font-family: var(--font); }
  .hub-t { font-family: var(--font); font-weight: 800; font-size: 16.5px; fill: #2760AB; }
  .hub-d { font-family: var(--font); font-weight: 500; font-size: 8.1px; fill: #6D6E70; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- builder ---------- */
  .settings { margin-top: 1.25rem; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.25rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 1.1rem 1.75rem; }
  .ctl label.head, .ctl .head { font-weight: 700; font-size: .95rem; display: flex; justify-content: space-between; gap: .5rem; margin-bottom: .3rem; }
  .ctl output { font-weight: 500; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  select { width: 100%; font: inherit; padding: .4rem .5rem; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .seg-ctl { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg-ctl label { flex: 1; text-align: center; padding: .35rem .4rem; cursor: pointer; font-size: .92rem; }
  .seg-ctl input { position: absolute; opacity: 0; pointer-events: none; }
  .seg-ctl label:has(input:checked) { background: var(--accent); color: var(--panel); font-weight: 700; }
  .seg-ctl label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -3px; }
  .checks { display: grid; gap: .35rem; }
  .checks label { display: flex; gap: .5rem; align-items: center; font-size: .95rem; cursor: pointer; }
  .checks input { accent-color: var(--accent); width: 1.05rem; height: 1.05rem; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 1.25rem 0; }

  .code { margin-top: 1.25rem; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 1.25rem; }
  .tabs { display: flex; gap: .5rem; margin-bottom: .75rem; flex-wrap: wrap; }
  .tabs button, .copy { font: inherit; font-size: .92rem; font-weight: 700; border-radius: 9px; padding: .4rem .8rem; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .copy { background: var(--accent); border-color: var(--accent); color: #fff; }
  pre { margin: 0; overflow-x: auto; background: var(--page); border-radius: 10px; padding: .9rem 1rem; font-size: .85rem; line-height: 1.55; white-space: pre-wrap; word-break: break-all; }
  .code-foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: .75rem; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: .9rem; margin: 0; max-width: 36rem; }
</style>
</head>
<body>
<main>
  <h1>Stefnuhringur</h1>
  <p class="lede">Forskoðun og kóðasmiður. Stilltu hringinn hér fyrir neðan og afritaðu innfellingarkóðann. Bentu á hringinn til að stöðva hann og smelltu á áherslu til að þysja inn.</p>

  <div class="stage"><div class="holder" id="holder">
    <div class="sh" id="sh" data-wtheme="auto" role="region" aria-label="Stefnuhringur Reykjanesbæjar">
      <svg id="svg">
        <defs><clipPath id="crop"><rect id="cropRect"/></clipPath></defs>
        <g clip-path="url(#crop)">
          <g id="cam1"><g id="rot"></g><g id="glyphs"></g><g id="labels"></g></g>
        </g>
        <g id="cam2"><g id="hub"></g></g>
      </svg>
      <div class="sr-only" aria-live="polite" id="live"></div>
    </div>
  </div></div>

  <form class="settings" id="form" onsubmit="return false">
    <h2>Stillingar</h2>
    <div class="grid">
      <div class="ctl"><label class="head" for="speed">Hraði <output id="o-speed"></output></label>
        <input id="speed" name="speed" type="range" min="0" max="20" step="1"></div>
      <div class="ctl"><span class="head">Snúningsátt</span>
        <div class="seg-ctl" role="radiogroup" aria-label="Snúningsátt">
          <label><input type="radio" name="dir" value="ccw">Rangsælis</label>
          <label><input type="radio" name="dir" value="cw">Réttsælis</label>
        </div></div>
      <div class="ctl"><label class="head" for="visible">Sýnilegur hluti <output id="o-visible"></output></label>
        <input id="visible" name="visible" type="range" min="50" max="100" step="5"></div>
      <div class="ctl"><label class="head" for="zoom">Aðdráttur við smell <output id="o-zoom"></output></label>
        <input id="zoom" name="zoom" type="range" min="1.2" max="2.5" step="0.1"></div>
      <div class="ctl"><label class="head" for="start">Upphafsstaða</label>
        <select id="start" name="start"></select></div>
      <div class="ctl"><span class="head">Miðjan</span>
        <div class="seg-ctl" role="radiogroup" aria-label="Miðjan">
          <label><input type="radio" name="hub" value="full">Alltaf heil</label>
          <label><input type="radio" name="hub" value="cut">Klippist með</label>
        </div></div>
      <div class="ctl"><span class="head">Sýna</span>
        <div class="checks">
          <label><input type="checkbox" name="pause"> Stöðva þegar bent er á</label>
          <label><input type="checkbox" name="desc"> Lýsingar alltaf</label>
          <label><input type="checkbox" name="sdg"> Heimsmarkmið</label>
          <label><input type="checkbox" name="icons"> Tákn</label>
        </div></div>
      <div class="ctl"><span class="head">Þema</span>
        <div class="seg-ctl" role="radiogroup" aria-label="Þema">
          <label><input type="radio" name="theme" value="auto">Sjálfv.</label>
          <label><input type="radio" name="theme" value="light">Ljóst</label>
          <label><input type="radio" name="theme" value="dark">Dökkt</label>
        </div>
        <div class="checks" style="margin-top:.5rem"><label><input type="checkbox" name="transparent"> Gegnsær bakgrunnur</label></div></div>
    </div>
    <hr>
    <div class="grid">
      <div class="ctl"><label class="head" for="radius">Hornarúnnun <output id="o-radius"></output></label>
        <input id="radius" name="radius" type="range" min="0" max="40" step="1"></div>
      <div class="ctl"><label class="head" for="maxw">Hámarksbreidd <output id="o-maxw"></output></label>
        <input id="maxw" name="maxw" type="range" min="280" max="1000" step="20"></div>
      <div class="ctl"><span class="head">Staðsetning á síðu</span>
        <div class="seg-ctl" role="radiogroup" aria-label="Staðsetning á síðu">
          <label><input type="radio" name="align" value="left">Vinstri</label>
          <label><input type="radio" name="align" value="center">Miðja</label>
          <label><input type="radio" name="align" value="right">Hægri</label>
        </div></div>
    </div>
  </form>

  <section class="code">
    <h2>Innfellingarkóði</h2>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-tab="iframe">iframe (mælt með)</button>
      <button type="button" role="tab" aria-selected="false" data-tab="script">Skrifta</button>
      <button type="button" role="tab" aria-selected="false" data-tab="url">Slóð</button>
    </div>
    <pre id="codeOut"></pre>
    <div class="code-foot">
      <p class="hint" id="codeHint"></p>
      <button type="button" class="copy" id="copy">Afrita kóða</button>
    </div>
  </section>
</main>

  function applyLayout() {
    st.cropY = -E + 2 * E * (opts.visible / 100);
    st.bottom = opts.hub === "full" ? Math.max(st.cropY, HUB + 12) : st.cropY;
    const h = st.bottom + E;
    svg.setAttribute("viewBox", `${-E} ${-E} ${2 * E} ${h}`);
    st.F = [0, -E + h / 2];
    if (st.zoomed === null) { st.cam.px = st.F[0]; st.cam.py = st.F[1]; }
    sh.dataset.wtheme = opts.theme;
    sh.classList.toggle("transparent", opts.bg === "transparent");
    sh.style.borderRadius = opts.radius + "px";
    segs.forEach(s => { s.tiles.style.display = opts.sdg ? "" : "none"; s.glyph.style.display = opts.icons ? "" : "none"; });
    const holder = document.getElementById("holder");
    holder.style.maxWidth = opts.maxw + "px";
    holder.style.marginLeft = opts.align === "left" ? "0" : "auto";
    holder.style.marginRight = opts.align === "right" ? "0" : "auto";
  }

  function setZoom(i) {
    st.zoomed = i;
    live.textContent = i === null ? "" : DATA.segments[i].title.join(" ") + ". " + DATA.segments[i].desc;
  }
  function toggleZoom(i) { setZoom(st.zoomed === i ? null : i); }

  sh.addEventListener("pointerenter", e => { if (e.pointerType !== "touch") st.hovered = true; });
  sh.addEventListener("pointerleave", e => { if (e.pointerType === "touch") return; st.hovered = false; setZoom(null); });
  sh.addEventListener("focusin", () => { st.hovered = true; });
  sh.addEventListener("focusout", e => { if (!sh.contains(e.relatedTarget)) { st.hovered = false; setZoom(null); } });
  document.addEventListener("pointerdown", e => { if (!sh.contains(e.target)) setZoom(null); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") setZoom(null); });

  // ---------- loop ----------
  const ease = (dt, r) => 1 - Math.exp(-dt * r);
  const nearest = t => st.rotation + ((((t - st.rotation) % 360) + 540) % 360 - 180);
  let last = performance.now(), visibleOnScreen = true;
  new IntersectionObserver(es => { visibleOnScreen = es[0].isIntersecting; }).observe(sh);

  function tick(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (!visibleOnScreen || document.hidden) { requestAnimationFrame(tick); return; }
    const zoomed = st.zoomed !== null;
    if (!zoomed) {
      const paused = (opts.pause && st.hovered) || !opts.speed || reduceMotion;
      const target = paused ? 0 : (opts.dir === "cw" ? 1 : -1) * 360 / opts.speed;
      st.vel += (target - st.vel) * ease(dt, 3.5);
      st.rotation += st.vel * dt;
    } else {
      st.vel = 0;
      st.rotation += (nearest(-DATA.segments[st.zoomed].angle) - st.rotation) * ease(dt, 7);
    }
    const f = ease(dt, 7), c = st.cam;
    c.k += ((zoomed ? opts.zoom : 1) - c.k) * f;
    c.px += ((zoomed ? 0 : st.F[0]) - c.px) * f;
    c.py += ((zoomed ? -LABEL_R + 8 : st.F[1]) - c.py) * f;
    st.zOpen += ((zoomed ? 1 : 0) - st.zOpen) * f;

    const tf = `translate(${st.F[0]} ${st.F[1]}) scale(${c.k}) translate(${-c.px} ${-c.py})`;
    cam1.setAttribute("transform", tf); cam2.setAttribute("transform", tf);
    rotG.setAttribute("transform", `rotate(${st.rotation})`);
    const clipY = st.cropY + (st.bottom - st.cropY) * st.zOpen;
    cropRect.setAttribute("x", -E - 10); cropRect.setAttribute("y", -E - 60);
    cropRect.setAttribute("width", 2 * E + 20); cropRect.setAttribute("height", clipY + E + 60);

    DATA.segments.forEach((s, i) => {
      const S = segs[i], a = s.angle + st.rotation;
      const showDesc = opts.desc || st.zoomed === i;
      S.open += ((showDesc ? 1 : 0) - S.open) * ease(dt, 8);
      const [x, y] = pt(LABEL_R, a);
      const H = S.tH + D_GAP + S.dH, off = S.open * (-H / 2 + S.tH / 2);
      S.lg.setAttribute("transform", `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
      S.tg.setAttribute("transform", `translate(0 ${off.toFixed(2)})`);
      S.dg.setAttribute("transform", `translate(0 ${(off + S.tH / 2 + D_GAP).toFixed(2)})`);
      S.dg.setAttribute("opacity", S.open.toFixed(3));
      const [gx, gy] = pt(BUB_RAD, a + BUB_OFF);
      S.glyph.setAttribute("x", (gx - 17).toFixed(2)); S.glyph.setAttribute("y", (gy - 17).toFixed(2));
      const dim = zoomed && st.zoomed !== i;
      S.g.classList.toggle("dim", dim); S.lg.classList.toggle("dim", dim); S.glyph.classList.toggle("dim", dim);
    });
    requestAnimationFrame(tick);
  }

  // ---------- builder ----------
  const form = document.getElementById("form");
  const SPEED_STEPS = [0, 600, 480, 360, 300, 240, 200, 180, 150, 120, 100, 90, 75, 60, 50, 45, 40, 35, 30, 25, 20];
  const speedToStep = s => { let best = 0, d = Infinity; SPEED_STEPS.forEach((v, i) => { const dd = Math.abs(v - s); if (dd < d) { d = dd; best = i; } }); return best; };
  const fmtSpeed = s => { if (!s) return "stopp"; const m = Math.floor(s / 60), r = s % 60;
    return "1 hringur á " + (m ? m + " mín" + (r ? " " + r + " sek" : "") : r + " sek"); };
  const startSel = form.elements.start;
  [["mynd", "Eins og á myndinni"], ...DATA.segments.map(s => [s.key, s.title.join(" ") + " efst"])].forEach(([v, t]) => {
    const o = document.createElement("option"); o.value = v; o.textContent = t; startSel.appendChild(o); });

  function toForm() {
    form.elements.speed.value = speedToStep(opts.speed);
    form.elements.visible.value = opts.visible; form.elements.zoom.value = opts.zoom;
    form.elements.radius.value = opts.radius; form.elements.maxw.value = opts.maxw; startSel.value = opts.start;
    ["dir", "hub", "theme", "align"].forEach(n => { [...form.querySelectorAll(`input[name=${n}]`)].forEach(r => r.checked = r.value === opts[n]); });
    ["pause", "desc", "sdg", "icons"].forEach(n => form.elements[n].checked = !!opts[n]);
    form.elements.transparent.checked = opts.bg === "transparent";
  }
  function fromForm(e) {
    opts.speed = SPEED_STEPS[+form.elements.speed.value];
    opts.visible = +form.elements.visible.value; opts.zoom = +form.elements.zoom.value;
    opts.radius = +form.elements.radius.value; opts.maxw = +form.elements.maxw.value;
    const newStart = startSel.value;
    ["dir", "hub", "theme", "align"].forEach(n => { const r = form.querySelector(`input[name=${n}]:checked`); if (r) opts[n] = r.value; });
    ["pause", "desc", "sdg", "icons"].forEach(n => opts[n] = form.elements[n].checked ? 1 : 0);
    opts.bg = form.elements.transparent.checked ? "transparent" : "";
    if (newStart !== opts.start || (e && e.target === startSel)) { opts.start = newStart; setZoom(null); st.rotation = nearest(startAngle()); }
    applyLayout(); render();
  }
  form.addEventListener("input", fromForm); form.addEventListener("change", fromForm);

  const WIDGET_KEYS = ["speed", "dir", "visible", "zoom", "start", "hub", "pause", "desc", "sdg", "icons", "theme", "bg", "radius"];
  const nonDefault = () => WIDGET_KEYS.filter(k => opts[k] !== DEFAULTS[k] && !(k === "bg" && !opts.bg));
  let tab = "iframe";
  function render() {
    document.getElementById("o-speed").textContent = fmtSpeed(opts.speed);
    document.getElementById("o-visible").textContent = opts.visible + " %";
    document.getElementById("o-zoom").textContent = String(opts.zoom.toFixed(1)).replace(".", ",") + "×";
    document.getElementById("o-radius").textContent = opts.radius + " px";
    document.getElementById("o-maxw").textContent = opts.maxw + " px";

    const q = new URLSearchParams(); nonDefault().forEach(k => q.set(k, opts[k]));
    const url = BASE + "widget/" + (q.toString() ? "?" + q : "");
    const [, , w, h] = svg.getAttribute("viewBox").split(" ").map(Number);
    const ratio = `${w} / ${Math.round(h)}`;
    const margins = opts.align === "left" ? "margin-left:0;margin-right:auto" : opts.align === "right" ? "margin-left:auto;margin-right:0" : "margin-left:auto;margin-right:auto";
    let code = "", hint = "";
    if (tab === "iframe") {
      code = `<iframe\n  src="${url}"\n  title="Stefnuhringur Reykjanesbæjar"\n  loading="lazy"\n  scrolling="no"\n  style="width:100%;max-width:${opts.maxw}px;aspect-ratio:${ratio};border:0;display:block;${margins}">\n</iframe>`;
      hint = "Límdu í HTML-reit eða Code/HTML blokk í Payload. Hæðin fylgir breiddinni sjálfkrafa (aspect-ratio).";
    } else if (tab === "script") {
      const attrs = nonDefault().map(k => `  data-${k}="${opts[k]}"`);
      if (opts.align !== "left") attrs.push(`  data-align="${opts.align}"`);
      attrs.push(`  data-max-width="${opts.maxw}px"`);
      code = `<script\n  src="${BASE}embed.js"\n${attrs.join("\n")}>\n<\/script>`;
      hint = "Aðeins ef Payload-uppsetningin leyfir <script>. Annars skaltu nota iframe.";
    } else {
      code = url; hint = "Bein slóð á græjuna, t.d. til að prófa stillingar.";
    }
    document.getElementById("codeOut").textContent = code;
    document.getElementById("codeHint").textContent = hint;
    try { const pq = new URLSearchParams(); nonDefault().forEach(k => pq.set(k, opts[k]));
      history.replaceState(null, "", location.pathname + (pq.toString() ? "?" + pq : "")); } catch (e) {}
  }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
    tab = b.dataset.tab; document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x === b)); render(); }));
  document.getElementById("copy").addEventListener("click", async e => {
    const text = document.getElementById("codeOut").textContent, btn = e.currentTarget;
    try { await navigator.clipboard.writeText(text); btn.textContent = "Afritað"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById("codeOut"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "Valið, ýttu á Ctrl+C"; }
    setTimeout(() => btn.textContent = "Afrita kóða", 1800);
  });

  toForm(); applyLayout(); render();
  st.cam.px = st.F[0]; st.cam.py = st.F[1];
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
